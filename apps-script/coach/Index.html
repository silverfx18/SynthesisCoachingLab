<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coach Console — Synthesis Coaching Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --teal:#2F9794;--teal-light:#3db8b4;--teal-dark:#1e6b69;--cream:#faf3ea;--cream2:#e7e2da;--dark:#0e181d;--muted:#6b7d7c;--white:#fff;
  --green:#27ae60;--green-bg:#eafaf1;--yellow:#f39c12;--yellow-bg:#fef9e7;--red:#c0392b;--red-bg:#fdedec;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Montserrat',sans-serif;background:var(--cream);color:var(--dark);font-size:13px;}
button,input,textarea,select{font-family:inherit;}
.topbar{background:var(--dark);color:var(--cream);padding:14px 22px;display:flex;align-items:center;gap:14px;position:relative;}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--teal),var(--teal-light),var(--teal));}
.topbar b{font-size:16px;font-weight:800;}
.topbar span{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--teal);padding:3px 8px;border-radius:2px;}
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 52px);}
.side{background:var(--white);border-right:1px solid var(--cream2);padding:14px;overflow:auto;max-height:calc(100vh - 52px);position:sticky;top:0;}
/* Daftar klien disembunyikan saat bekerja di satu klien, supaya nama klien lain tidak terlihat di layar */
.side-tog{background:transparent;border:1.5px solid rgba(255,255,255,.35);color:var(--cream);border-radius:6px;padding:5px 10px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
.side-tog:hover{border-color:var(--teal-light);}
body.side-hidden .layout{grid-template-columns:1fr;}
body.side-hidden .side{display:none;}
.side input{width:100%;border:1.5px solid var(--cream2);border-radius:6px;padding:9px 11px;font-size:12.5px;background:var(--cream);outline:none;margin-bottom:10px;}
.side input:focus{border-color:var(--teal);background:#fff;}
.cl{padding:10px 11px;border-radius:8px;cursor:pointer;border:1.5px solid transparent;margin-bottom:4px;}
.cl:hover{background:var(--cream);}
.cl.active{border-color:var(--teal);background:#f1faf9;}
.cl b{display:block;font-size:12.5px;}
.cl small{font-size:10px;color:var(--muted);}
.dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px;}
.dot{font-size:8.5px;font-weight:700;padding:1px 5px;border-radius:8px;background:var(--cream);color:var(--muted);white-space:nowrap;}
.dot.on{background:var(--teal);color:#fff;}
.main{padding:18px 24px 90px;min-width:0;}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:13px;line-height:1.7;}
.tabs{display:flex;gap:6px;margin:14px 0 16px;border-bottom:1.5px solid var(--cream2);flex-wrap:wrap;}
.tab{background:none;border:none;padding:10px 14px;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;}
.tab.active{color:var(--teal-dark);border-bottom-color:var(--teal);}
.card{background:var(--white);border:1px solid var(--cream2);border-radius:10px;padding:16px 18px;margin-bottom:14px;}
.card-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--teal);margin-bottom:12px;}
.head-name{font-size:22px;font-weight:900;}
.head-sub{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6;}
.head-sub a{color:var(--teal-dark);font-weight:700;}
.flags{list-style:none;}
.flags li{padding:8px 12px;border-radius:7px;margin-bottom:6px;font-size:12px;line-height:1.5;background:var(--yellow-bg);border-left:4px solid var(--yellow);}
.flags li.red{background:var(--red-bg);border-left-color:var(--red);font-weight:600;}
.flags li.none{background:var(--green-bg);border-left-color:var(--green);}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;}
.stat{border:1px solid var(--cream2);border-radius:8px;padding:10px 12px;background:#fffbf5;}
.stat-l{font-size:8.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.stat-v{font-size:19px;font-weight:900;color:var(--teal);line-height:1.15;}
.stat-v small{font-size:10px;color:var(--muted);font-weight:600;}
.stat-s{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4;}
.none-text{color:var(--muted);font-size:12px;}
.full-tool{padding:12px 0;border-bottom:1px dashed var(--cream2);font-size:12px;line-height:1.6;}
.full-tool:last-of-type{border-bottom:none;}
.full-tool h4{font-size:12px;font-weight:800;margin:0 0 6px;}
.full-tool p{margin:4px 0 8px;}
.full-tool ul{margin:4px 0 0 18px;padding:0;}
.full-head{font-size:14px;font-weight:700;color:var(--teal);}
.peta{display:grid;grid-template-columns:auto repeat(3,1fr);gap:3px;max-width:340px;margin:10px 0 4px;font-size:10px;}
.peta-h{color:var(--muted);font-weight:600;text-align:center;align-self:center;padding:2px 4px;}
.peta-c{height:26px;border-radius:4px;background:var(--cream2);display:flex;align-items:center;justify-content:center;font-size:14px;}
.peta-c.on{background:var(--teal);color:#fff;}
details{border:1px solid var(--cream2);border-radius:8px;margin-bottom:8px;background:#fff;}
summary{padding:10px 14px;font-weight:700;font-size:12px;cursor:pointer;color:var(--teal-dark);}
.ans{padding:0 14px 10px;}
.ans-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 0;border-top:1px dashed var(--cream2);font-size:11.5px;line-height:1.45;}
.ans-row span:first-child{color:var(--muted);}
.ans-row span:last-child{font-weight:600;white-space:pre-wrap;}
/* FORM SESI */
.secnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.secnav button{font-family:inherit;font-size:10.5px;font-weight:600;color:var(--dark);background:#fff;border:1px solid var(--cream2);border-radius:14px;padding:5px 10px;cursor:pointer;}
.secnav button:hover{border-color:var(--teal);}
.sec{background:#fff;border:1px solid var(--cream2);border-radius:10px;margin-bottom:14px;overflow:hidden;scroll-margin-top:12px;}
.sec-h{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--cream2);background:#fffbf5;}
.sec-n{width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.sec-t{font-size:14px;font-weight:800;}
.sec-s{font-size:10.5px;color:var(--muted);margin-top:1px;}
.q{padding:13px 18px;border-bottom:1px solid var(--cream2);}
.q:last-child{border-bottom:none;}
.q-l{font-size:12px;font-weight:600;margin-bottom:8px;line-height:1.45;}
.q-h{font-size:10.5px;color:var(--teal-dark);background:#f1faf9;border-radius:6px;padding:6px 9px;margin:-2px 0 8px;line-height:1.5;}
.q-i{font-size:10.5px;color:var(--muted);margin-bottom:8px;}
.inp{width:100%;border:1.5px solid var(--cream2);border-radius:6px;padding:8px 10px;font-size:12.5px;background:var(--cream);outline:none;}
.inp:focus{border-color:var(--teal);background:#fff;}
textarea.inp{min-height:58px;resize:vertical;line-height:1.5;}
.q.note{background:#fffdf8;}
.unit{display:flex;gap:8px;align-items:center;max-width:210px;}
.unit span{font-size:11px;color:var(--muted);font-weight:600;}
.meas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;}
.meas .q{border-right:1px solid var(--cream2);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{cursor:pointer;}
.chip input{position:absolute;opacity:0;pointer-events:none;}
.chip span{display:inline-block;border:1.5px solid var(--cream2);background:var(--cream);border-radius:18px;padding:6px 11px;font-size:11.5px;font-weight:500;}
.chip input:checked+span{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.score{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:14px;}
.s-ok{background:var(--green-bg);color:var(--green);}
.s-risk{background:var(--red-bg);color:var(--red);}
.guide{font-size:11px;line-height:1.6;padding:12px 18px;background:#fffbf5;}
.guide li{margin-left:16px;margin-bottom:4px;}
.savebar{position:fixed;left:0;right:0;bottom:0;background:var(--dark);padding:10px 22px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:30;}
.savebar .msg{color:var(--muted);font-size:11px;margin-right:auto;}
.btn{padding:10px 18px;border-radius:7px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;}
.btn-p{background:var(--teal);color:#fff;}
.btn-p:hover{background:var(--teal-dark);}
.btn-s{background:transparent;color:var(--cream);border:1.5px solid var(--muted);}
.btn-o{background:transparent;color:var(--teal);border:2px solid var(--teal);}
.loading{position:fixed;top:12px;right:16px;background:var(--dark);color:var(--cream);font-size:11px;padding:7px 12px;border-radius:6px;z-index:50;display:none;}
.err{background:var(--red-bg);color:var(--red);border:1.5px solid var(--red);border-radius:8px;padding:12px 16px;margin-bottom:14px;font-size:12px;}
/* AI & LINK */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.ai-badge{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:8px;background:#fdf2e9;color:#b35900;margin-left:4px;}
.ai-text{font-size:12px;line-height:1.65;white-space:normal;}
.ai-text h4{font-size:12px;color:var(--teal-dark);margin:12px 0 4px;}
.ai-text h4:first-child{margin-top:0;}
.ai-text ul{margin:0 0 4px 18px;}
.linkrow{display:grid;grid-template-columns:140px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px dashed var(--cream2);font-size:11px;}
.linkrow code{font-size:10.5px;background:var(--cream);padding:5px 7px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.modal{position:fixed;inset:0;background:rgba(14,24,29,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal-box{background:#fff;border-radius:12px;max-width:720px;width:100%;padding:18px;}
.modal-box textarea{width:100%;height:320px;font-size:11px;font-family:monospace;border:1.5px solid var(--cream2);border-radius:8px;padding:10px;}
.ai-modal{max-height:92vh;display:flex;flex-direction:column;}
.ai-modal #aiStep{display:flex;flex-direction:column;min-height:0;}
.ai-list{overflow:auto;max-height:60vh;border:1px solid var(--cream2);border-radius:8px;padding:10px;}
.ai-sum{font-size:12px;font-weight:700;margin-bottom:8px;}
.ai-row{font-size:11.5px;line-height:1.5;padding:6px 0;border-bottom:1px dashed var(--cream2);}
.ai-row div{white-space:pre-wrap;color:var(--dark);}
.ai-opt{display:block;margin-top:4px;font-size:11px;}
.tg td:first-child{width:28%;}
.tg-ok{color:var(--green);font-weight:700;}
.tg-mid{color:#b9770e;font-weight:700;}
.tg-bad{color:var(--red);font-weight:700;}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:6px;}
.calc-box{border:1px solid var(--cream2);border-radius:8px;padding:12px;}
.calc-out{margin-top:10px;font-size:13px;background:var(--cream);border-radius:6px;padding:8px 10px;}
.ba td.up{color:var(--green);font-weight:700;}
.ba td.down{color:var(--red);font-weight:700;}
/* ANTROPOMETRI */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.mgrid .stat-l{margin-bottom:5px;}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;}
.chart{border:1px solid var(--cream2);border-radius:8px;padding:10px 12px 6px;background:#fff;}
.chart-t{font-size:11px;font-weight:700;margin-bottom:4px;}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--muted);margin-bottom:2px;}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:4px;vertical-align:middle;}
.chart svg{width:100%;height:auto;display:block;}
.htbl{border-collapse:collapse;font-size:11px;min-width:100%;}
.htbl th,.htbl td{padding:5px 8px;border-bottom:1px solid var(--cream2);text-align:right;white-space:nowrap;}
.htbl th:first-child,.htbl td:first-child{text-align:left;position:sticky;left:0;background:#fff;color:var(--muted);}
.htbl th{font-size:9.5px;color:var(--muted);vertical-align:bottom;}
.htbl tr.calc td{background:#fbfaf7;}
.htbl tr.calc td:first-child{background:#fbfaf7;}
.htbl td.up{color:var(--green);font-weight:700;}
.htbl td.down{color:var(--red);font-weight:700;}
.xbtn{border:none;background:none;color:var(--muted);cursor:pointer;font-size:10px;text-decoration:underline;}
/* REPORT KLIEN */
.rk-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px;}
.rk-bar select,.rk-bar input{width:auto;}
.rk-ed .q-l{margin-bottom:6px;}
.rk-ed textarea.inp{min-height:84px;}
.rk-chips{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 8px;}
.rk-chip{border:1px dashed var(--teal);background:#f1faf9;color:var(--teal-dark);font-size:10.5px;font-weight:600;border-radius:14px;padding:4px 9px;cursor:pointer;}
.rkdoc{background:#fff;border:1px solid var(--cream2);border-radius:10px;padding:28px 34px;font-size:12px;line-height:1.7;color:var(--dark);}
.rkdoc h1{font-size:19px;font-weight:900;letter-spacing:.5px;margin:10px 0 4px;}
.rkdoc .client{font-size:13px;margin-bottom:14px;}
.rkdoc h2{font-size:12.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--teal-dark);border-bottom:2px solid var(--teal);padding-bottom:3px;margin:20px 0 10px;}
.rkdoc h3{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 4px;}
.rkdoc table.rk-antro{border-collapse:collapse;width:100%;max-width:520px;}
.rk-antro td{padding:3px 6px;border-bottom:1px solid var(--cream2);}
.rk-antro td:first-child{color:var(--muted);width:58%;}
.rkdoc .note{font-size:10px;color:var(--muted);font-style:italic;}
.rkdoc .quote{margin-top:18px;font-style:italic;border-left:3px solid var(--teal);padding-left:10px;}
.rkdoc .sign{margin-top:18px;}
.rkdoc ul{margin:2px 0 6px 18px;}
.rkdoc p{margin:0 0 6px;}
.rkwrap{width:100%;border-collapse:collapse;}
.rkwrap>thead td,.rkwrap>tfoot td{padding:0;border:none;}
.rkwrap .hdr{font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:var(--red);text-transform:uppercase;padding-bottom:8px;}
.rkwrap .ftr{font-size:9.5px;font-weight:700;letter-spacing:1.5px;color:var(--muted);text-align:center;text-transform:uppercase;padding-top:14px;}
.rkwrap>tbody>tr>td{padding:0;border:none;}
@media print{
  body.rk-print .rkdoc{border:none;padding:0;}
  body.rk-print .head-name,body.rk-print .head-sub,body.rk-print .toolbar{display:none !important;}
  body.rk-print .rkdoc h2,body.rk-print .rkdoc h3{break-after:avoid;}
  body.rk-print .rkdoc .chart,body.rk-print .rk-antro{break-inside:avoid;}
}
/* REPORT */
.rep{background:#fff;border:1px solid var(--cream2);border-radius:12px;overflow:hidden;}
.rep-h{background:var(--dark);color:var(--cream);padding:22px 26px;}
.rep-h small{display:block;font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.rep-h b{font-size:21px;font-weight:900;}
.rep-h div{font-size:10.5px;color:var(--muted);margin-top:4px;}
.rep-s{padding:16px 26px;border-bottom:1px solid var(--cream2);}
.tbl{width:100%;border-collapse:collapse;font-size:11.5px;}
.tbl th{text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:6px 8px;border-bottom:1.5px solid var(--cream2);}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--cream2);vertical-align:top;}
.tbl td:first-child{color:var(--muted);width:38%;}
@media(max-width:800px){
  .linkrow{grid-template-columns:1fr;}
  .layout{grid-template-columns:1fr;}
  .side{position:static;max-height:260px;border-right:none;border-bottom:1px solid var(--cream2);}
  .main{padding:14px 12px 90px;}
  .ans-row{grid-template-columns:1fr;gap:2px;}
}
@media print{
  @page{size:A4;margin:10mm 12mm;}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .topbar,.side,.tabs,.savebar,.no-print,.loading{display:none !important;}
  .layout{display:block;}
  .main{padding:0;}
  .rep{border:none;}
  .rep-h{background:#fff;color:var(--dark);border-bottom:2px solid var(--teal);}
  .rep-s,details{break-inside:avoid;}
  details{border:none;}
  details>summary{list-style:none;}
}
</style>
</head>
<body>
<div class="topbar"><button type="button" class="side-tog" id="sideTog" aria-expanded="true">✕ Tutup daftar</button><span>Synthesis Coaching Lab</span><b>Coach Console</b></div>
<div class="loading" id="loading">Memuat…</div>
<div class="layout">
  <aside class="side">
    <input id="search" placeholder="Cari nama / nomor WA…" autocomplete="off">
    <div id="clientList"><div class="none-text">Memuat daftar klien…</div></div>
  </aside>
  <main class="main" id="main">
    <div class="empty">Pilih klien di sebelah kiri.<br>Klien muncul otomatis setelah mengisi salah satu assessment.</div>
  </main>
</div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   KONFIGURASI: kontak rujukan (isi sendiri)
   ════════════════════════════════════════════════════════════════════════ */
const REFERRAL_CONTACTS = 'Isi daftar kontak rujukan kamu di sini (psikolog, psikiater, dokter umum, dokter spesialis gizi klinik) — edit konstanta REFERRAL_CONTACTS di Index.html.';
// Alamat website assessment (GitHub Pages), dipakai untuk membuat link personal klien.
const PUBLIC_BASE_URL = 'https://silverfx18.github.io/SynthesisCoachingLab/';
// Batas body fat (%) untuk estimasi berat badan maksimal.
// BF_TARGET = target yang biasa dipakai coach di laporan (bukan dari satu jurnal tertentu, boleh diubah).
// BF_OBESITAS = definisi obesitas berbasis %BF yang lazim dipakai di penelitian (lihat BF_REFS).
const COACH_SIGN = 'Felix, S.T., CSN.';
const RK_QUOTE = 'You are what you digest. Diet itu bukan dengan makan sedikit. Tapi makan sesuai yang tubuh butuhkan dengan tujuan membantu tubuh berfungsi secara optimal mendukung aktifitas harian.';
const BF_TARGET = { L: 20, P: 28 };
const BF_OBESITAS = { L: 25, P: 35 };
const BF_REFS = [
  ['Gallagher D, dkk. Healthy percentage body fat ranges: an approach for developing guidelines based on body mass index. Am J Clin Nutr. 2000;72(3):694–701.', 'https://doi.org/10.1093/ajcn/72.3.694'],
  ['Deurenberg P, Deurenberg-Yap M, Guricci S. Asians are different from Caucasians and from each other in their body mass index/body fat per cent relationship. Obes Rev. 2002;3(3):141–6. (Orang Asia, termasuk Indonesia, rata-rata punya %BF 3–5 poin lebih tinggi pada BMI yang sama.)', 'https://doi.org/10.1046/j.1467-789x.2002.00065.x'],
  ['Pongchaiyakul C, dkk. Association between waist circumference and percentage body fat among rural Thais. J Med Assoc Thai. 2006;89(10):1592–600. (Obesitas: %BF ≥25 pria, ≥35 wanita; DXA.)', 'https://pubmed.ncbi.nlm.nih.gov/17128832/'],
  ['Fielding RA, dkk. Characterizing sarcopenia and sarcopenic obesity in patients aged 65 years and over (SARA-OBS). BMC Geriatr. 2025;25:590. (Obesitas: %BF >25 pria, >35 wanita.)', 'https://doi.org/10.1186/s12877-025-05895-9']
];
const bfRefsHtml = () => `<div class="stat-s" style="margin-top:8px;line-height:1.6"><b>Referensi batas body fat:</b><ol style="margin:4px 0 0 18px">${BF_REFS.map(([t, u]) => `<li>${esc(t)} <a href="${u}" target="_blank" rel="noopener">${esc(u.replace('https://', ''))}</a></li>`).join('')}</ol></div>`;

/* ════════════════════════════════════════════════════════════════════════
   UTIL
   ════════════════════════════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
// Menu bagian Form Sesi: gulir dengan JS. Link "#anchor" di iframe Apps Script membuka halaman kosong.
document.addEventListener('click', e => {
  const b = e.target.closest('.secnav [data-sec]'); if (!b) return;
  const t = document.getElementById(b.dataset.sec); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
});
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(',', '.')); return isFinite(n) ? n : null; };
const fmt = (n, d = 1) => n == null || n === '' ? '–' : Number(n).toLocaleString('id-ID', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtDate = s => { if (!s) return '–'; const d = new Date(s); return isNaN(d) ? String(s) : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }); };
const strip = s => String(s).replace(/<[^>]+>/g, '');
const FORMS = ['Intake', 'MCTQ', 'PSQI', 'StressTidur', 'Reassessment', 'Sesi', 'Antropometri'];
const FORM_LABEL = { Intake: 'Intake', MCTQ: 'MCTQ', PSQI: 'PSQI', StressTidur: 'Stres', Reassessment: 'Re-assess', Sesi: 'Sesi', Antropometri: 'Ukur' };

function api(fn, ...args) {
  $('loading').style.display = 'block';
  return new Promise((res, rej) => {
    google.script.run
      .withSuccessHandler(v => { $('loading').style.display = 'none'; res(v); })
      .withFailureHandler(e => { $('loading').style.display = 'none'; rej(e); })[fn](...args);
  });
}

let CLIENTS = [], CUR = null, CD = null, TAB = 'ringkasan', SA = {}, DIRTY = false;

// Data intake + data diri yang dilengkapi coach (isian coach menang kalau diisi)
function intakeData() {
  const d = Object.assign({}, (CD && CD.forms.Intake && CD.forms.Intake.data) || {});
  const p = (CD && CD.profile) || {};
  ['tglLahir', 'jk', 'pekerjaan', 'domisili', 'email'].forEach(k => { if (p[k]) d[k] = p[k]; });
  if (p.tglLahir) d.usia = hitungUsia(p.tglLahir);
  else if (!d.usia) {
    const other = ['MCTQ', 'StressTidur', 'PSQI'].map(f => CD && CD.forms[f] && CD.forms[f].data.usia).find(Boolean);
    if (other) d.usia = parseInt(other, 10) || '';
  }
  return d;
}
function hitungUsia(t) {
  const n = new Date(), b = new Date(t);
  if (isNaN(b)) return '';
  let a = n.getFullYear() - b.getFullYear();
  const m = n.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && n.getDate() < b.getDate())) a--;
  return a;
}
function ctx() { const d = intakeData(); return { jk: d.jk }; }
function lastSession() { return (CD && CD.sessions[0]) || null; }

async function loadClients() {
  try { CLIENTS = await api('getClients'); renderClients(); }
  catch (e) { $('clientList').innerHTML = `<div class="err">${esc(e.message || e)}</div>`; }
}
function renderClients() {
  const q = $('search').value.trim().toLowerCase();
  const list = CLIENTS.filter(c => !q || c.nama.toLowerCase().includes(q) || c.clientId.includes(q.replace(/^0/, '62')));
  $('clientList').innerHTML = list.length ? list.map(c => `
    <div class="cl ${c.clientId === CUR ? 'active' : ''}" data-id="${esc(c.clientId)}">
      <b>${esc(c.nama || '(tanpa nama)')}${c.needsAi ? '<span class="ai-badge">🤖 belum dianalisis</span>' : ''}</b><small>+${esc(c.clientId)} · aktif ${fmtDate(c.terakhirAktif)}</small>
      <div class="dots">${FORMS.map(f => `<span class="dot ${c.done[f] ? 'on' : ''}">${FORM_LABEL[f]}</span>`).join('')}</div>
    </div>`).join('') : '<div class="none-text">Belum ada klien.</div>';
}

/* ── Flags ───────────────────────────────────────────────────────────── */
function allFlags() {
  const f = [];
  const d = intakeData();
  String(d.flags || '').split(' | ').filter(Boolean).forEach(x => f.push({ t: x, src: 'Intake' }));
  const s = lastSession();
  if (s) String(s.data.flags || '').split(' | ').filter(Boolean).forEach(x => f.push({ t: x, src: 'Sesi ' + fmtDate(s.submittedAt) }));
  const p = CD.forms.PSQI && CD.forms.PSQI.data;
  if (p && num(p.skorTotal) > 10) f.push({ t: `PSQI ${p.skorTotal}/21 (gangguan tidur serius): pertimbangkan rujukan`, src: 'PSQI' });
  const st = CD.forms.StressTidur && CD.forms.StressTidur.data;
  if (st && stresKategori(st) === 'Tinggi') f.push({ t: `Stres tinggi (skor ${st.skorStress}/40)`, src: 'Stres' });
  const re = CD.forms.Reassessment && CD.forms.Reassessment.data;
  if (re) String(re.flags || '').split(' | ').filter(Boolean).forEach(x => f.push({ t: x, src: 'Re-assessment ' + (re.fase || '') }));
  const lm = (CD.measurements || []).slice(-1)[0];
  if (lm && lm.data.flags) f.push({ t: lm.data.flags, src: 'Antropometri ' + fmtDate(lm.data.tanggalUkur) });
  const c = CLIENTS.find(x => x.clientId === CUR);
  if (c && c.needsAi) f.push({ t: `🤖 Ada data baru sejak ${c.aiSentAt ? 'terakhir disalin ke Claude (' + fmtDate(c.aiSentAt) + ')' : 'awal'}, belum dianalisis AI`, src: 'Sistem' });
  return f;
}
function flagsHtml() {
  const f = allFlags();
  if (!f.length) return '<ul class="flags"><li class="none">Tidak ada flag. Tetap cek ulang saat sesi.</li></ul>';
  return `<ul class="flags">${f.map(x => `<li class="${/RED FLAG|PAR-Q|SCOFF|PHQ|serius/i.test(x.t) ? 'red' : ''}">${esc(x.t)} <small style="color:var(--muted)">· ${esc(x.src)}</small></li>`).join('')}</ul>`;
}

/* ── Ringkasan ───────────────────────────────────────────────────────── */
function stat(l, v, u, s) { return `<div class="stat"><div class="stat-l">${l}</div><div class="stat-v">${v}${u ? ` <small>${u}</small>` : ''}</div>${s ? `<div class="stat-s">${s}</div>` : ''}</div>`; }

function rawGroups(raw, skip) {
  const g = {};
  (raw || []).filter(x => x.v && !(skip || []).includes(x.s)).forEach(x => { (g[x.s] = g[x.s] || []).push(x); });
  return g;
}
function rawHtml(raw, openFirst, skip) {
  const g = rawGroups(raw, skip);
  const keys = Object.keys(g);
  if (!keys.length) return '<div class="none-text">Belum ada data.</div>';
  return keys.map((s, i) => `<details ${openFirst && i === 0 ? 'open' : ''}><summary>${esc(s)} <small style="color:var(--muted);font-weight:500">(${g[s].length})</small></summary>
    <div class="ans">${g[s].map(x => `<div class="ans-row"><span>${esc(x.q)}</span><span>${esc(x.v)}</span></div>`).join('')}</div></details>`).join('');
}

};
const SJL_TXT = [
  [1, 'Rendah', 'Seperti tetap di kota yang sama setiap hari, tidak ada jet lag.', 'Jam biologis dan jadwal sosialmu selaras. Kondisi ideal, tubuhmu tidak perlu "menyesuaikan diri" setiap awal minggu.'],
  [2, 'Sedang', 'Ibarat pindah timezone WIB → WITA setiap Senin, balik lagi setiap Jumat.', 'Ada misalignment antara jam biologis dan jadwal sosial. Ini bisa mempengaruhi metabolisme, mood, dan energi awal minggu.'],
  [3, 'Tinggi', 'Ibarat pindah timezone WIB → WIT (Jakarta → Jayapura) setiap Senin pagi.', 'Social jet lag signifikan. Riset menunjukkan SJL >2 jam berkorelasi dengan peningkatan risiko metabolik, mood tidak stabil, dan penurunan performa kognitif.'],
  [Infinity, 'Sangat tinggi', 'Ibarat terbang Jakarta → Tokyo setiap Senin pagi, balik setiap Jumat.', 'Social jet lag ekstrem. Level misalignment yang sangat serius. Perlu strategi penyesuaian bertahap.']
];
// Teks durasi dari mctq (durFmt): "2 jam", "1j 30m", "0 jam (natural)" → jam desimal
function parseDur(t) {
  const s = String(t || ''), h = s.match(/(\d+)\s*(?:jam|j)\b/), m = s.match(/(\d+)\s*m\b/);
  return h || m ? (h ? +h[1] : 0) + (m ? +m[1] / 60 : 0) : null;
}
const PSQI_COMP = [['c1Kualitas', 'C1 Kualitas tidur subjektif'], ['c2Latensi', 'C2 Latensi (waktu untuk terlelap)'], ['c3Durasi', 'C3 Durasi tidur'], ['c4Efisiensi', 'C4 Efisiensi tidur'], ['c5Gangguan', 'C5 Gangguan saat tidur'], ['c6Obat', 'C6 Penggunaan obat tidur'], ['c7Disfungsi', 'C7 Disfungsi siang hari']];
function psqiTxt(total) {
  return total <= 5 ? ['Kualitas Tidur Baik (Good Sleeper)', 'Pola tidur berada dalam rentang adaptif yang sehat.', 'Pertahankan jadwal jam sirkadian ini secara konsisten.']
    : total <= 10 ? ['Kualitas Tidur Buruk (Poor Sleeper)', 'Terindikasi adanya kendala istirahat yang signifikan.', 'Evaluasi komponen dengan skor tertinggi (2 atau 3) sebagai fokus utama intervensi sleep hygiene.']
      : ['Gangguan Tidur Serius', 'Skor global menunjukkan hambatan tidur yang berat.', 'Sangat direkomendasikan konsultasi klinis lanjutan bersama profesional kesehatan atau spesialis tidur.'];
}
// Stres: pembagian PSS-10 yang lazim dipakai (0–13 / 14–26 / 27–40). Tidur: skala buatan sendiri (7–35).
const ST_STRES = ['Rendah', 'Sedang', 'Tinggi'], ST_TIDUR = ['Perlu Perhatian', 'Bisa Lebih Optimal', 'Restoratif'];
// Salinan matriks interpretasi stress-tidur.html: [tidur 0=Perlu Perhatian, 1=Bisa Lebih Optimal, 2=Restoratif][stres 0..2]
const ST_MATRIX = [
  [['Fokus Perbaiki Tidur', 'Stresmu masih terkendali, tapi tidurmu belum pulih dengan baik. Ini bisa karena kebiasaan tidur yang kurang konsisten, lingkungan kamar, atau ritme tubuhmu yang belum ketemu. Perlu dieksplorasi lebih dalam bersama tenaga profesional.'],
   ['Dua Masalah, Satu Loop', 'Stres mulai menanjak dan kualitas tidurmu juga terganggu. Keduanya punya cara memperparah satu sama lain — stres bikin susah tidur, kurang tidur bikin stres makin berat. Pilih satu yang paling terasa mengganggu, dan mulai dari situ.'],
   ['Perlu Perhatian Sekarang', 'Stres tinggi dan tidur yang buruk adalah kombinasi yang berat. Tubuhmu tidak punya ruang untuk pulih. Kondisi ini sulit diputus sendiri karena keduanya terus saling memperkuat. Sangat disarankan untuk segera berkonsultasi dengan tenaga profesional.']],
  [['Ada Ruang untuk Lebih Baik', 'Kondisi cukup baik. Stresmu rendah dan tidur masih oke. Tapi ada ruang untuk ditingkatkan — terutama di konsistensi jam tidur. Kualitas tidur yang benar-benar restoratif itu beda rasanya.'],
   ['Mulai Perhatikan Sebelum Terlambat', 'Stres dan tidur keduanya ada di zona tengah. Belum darurat, tapi kalau salah satunya memburuk, yang lain biasanya ikut. Cari tahu mana yang lebih mengganggu dan tangani duluan.'],
   ['Stres Tinggi, Tidur Masih Bertahan', 'Stresmu tinggi, tapi tidurmu masih cukup — untuk sekarang. Ini sinyal yang perlu direspons, bukan ditunggu. Tanpa intervensi, tidurmu kemungkinan besar akan ikut terdampak dalam waktu dekat.']],
  [['Kondisi Bagus, Pertahankan', 'Stres terkendali dan tidurmu restoratif. Ini kondisi yang bagus — dan bukan kebetulan. Ada sesuatu yang kamu lakukan dengan benar. Identifikasi kebiasaan itu dan jaga konsistensinya.'],
   ['Tidur Oke, Tapi Stres Mulai Naik', 'Tidurmu masih bagus dan itu modal besar. Tapi stres mulai meningkat dan kalau dibiarkan, tidurmu yang jadi korban pertama. Cari sumber stres utamamu sekarang sebelum mulai mengganggu hidupmu.'],
   ['Stres Tinggi — Jangan Tunggu Tidurmu Ikut Rusak', 'Tidurmu masih terjaga meski stresmu tinggi. Itu baik. Tapi ini bukan kondisi yang bisa terus dipertahankan tanpa aksi. Stres yang tidak ditangani cepat atau lambat akan menggerus kualitas tidurmu. Prioritaskan manajemen stres sekarang.']]
];
const stresIdx = s => s <= 13 ? 0 : s <= 26 ? 1 : 2;
const tidurIdx = t => t <= 12 ? 2 : t <= 21 ? 1 : 0;
function stresKategori(st) { return st && st.skorStress !== '' && st.skorStress != null ? ST_STRES[stresIdx(num(st.skorStress))] : (st && st.kategoriStress) || ''; }

function toolsFullHtml() {
  const f = CD.forms, m = f.MCTQ && f.MCTQ.data, p = f.PSQI && f.PSQI.data, st = f.StressTidur && f.StressTidur.data;
  if (!m && !p && !st) return '<div class="none-text">Belum ada tool yang diisi.</div>';
  const when = k => `<span class="stat-s" style="font-weight:400">· ${fmtDate(f[k].submittedAt)}</span>`;
  const row = (l, v) => v === '' || v == null ? '' : `<tr><td>${l}</td><td>${v}</td></tr>`;
  const out = [];
  if (m) {
    const c = CHRONO[String(m.chronotype || '').toUpperCase()] || {}, sjl = parseDur(m.sjl), sj = sjl == null ? null : SJL_TXT.find(x => sjl < x[0]);
    out.push(`<div class="full-tool"><h4>MCTQ · Chronotype ${when('MCTQ')}</h4>
      <div class="full-head">${esc(c.hewan || '')} · ${esc(m.chronotype)} <small>(${esc(c.sub || '')})</small></div>
      ${c.about ? `<p>${esc(c.about)}</p>` : ''}
      <table class="tbl">${row('Jam ideal tidur', esc(c.tidur))}${row('Jam ideal fokus', esc(c.fokus))}${row('Jam ideal olahraga', esc(c.olahraga))}
        ${row('Mid-sleep hari bebas (MSFsc)', esc(m.msfsc))}${row('Durasi tidur hari kerja / bebas', `${esc(m.sdKerja)} / ${esc(m.sdBebas)}`)}${row('Sleep debt', esc(m.sleepDebt))}
        ${row('Social jet lag', `${esc(m.sjl)}${sj ? ` · <b>${sj[1]}</b><br><small>${esc(sj[2])} ${esc(sj[3])}</small>` : ''}`)}</table></div>`);
  }
  if (p) {
    const total = num(p.skorTotal), t = psqiTxt(total);
    out.push(`<div class="full-tool"><h4>PSQI · Kualitas Tidur ${when('PSQI')}</h4>
      <div class="full-head">${esc(t[0])} · ${esc(p.skorTotal)}/21</div>
      <p>${esc(t[1])} <b>Rekomendasi:</b> ${esc(t[2])}</p>
      <table class="tbl">${PSQI_COMP.map(([k, l]) => row(l, num(p[k]) >= 2 ? `<b style="color:var(--red,#b03a2e)">${esc(p[k])} / 3</b>` : `${esc(p[k])} / 3`)).join('')}
        ${row('Jam tidur → bangun', p.jamTidur ? `${esc(p.jamTidur)} → ${esc(p.jamBangun)}` : '')}${row('Latensi', p.latensiMenit !== '' && p.latensiMenit != null ? `${esc(p.latensiMenit)} menit` : '')}
        ${row('Durasi tidur', p.durasiJam !== '' && p.durasiJam != null ? `${esc(p.durasiJam)} jam` : '')}${row('Efisiensi tidur', p.efisiensiPersen !== '' && p.efisiensiPersen != null ? `${esc(p.efisiensiPersen)}%` : '')}</table></div>`);
  }
  // Peta 3×3 (baris = kualitas tidur, kolom = stres) dengan posisi ti/si
  const petaHtml = (ti, si, rowLabels, note) => `<div class="peta"><div></div>${ST_STRES.map(x => `<div class="peta-h">${x}</div>`).join('')}
    ${[2, 1, 0].map(r => `<div class="peta-h">${rowLabels[r]}</div>${[0, 1, 2].map(c => `<div class="peta-c${r === ti && c === si ? ' on' : ''}">${r === ti && c === si ? '★' : ''}</div>`).join('')}`).join('')}</div>
    <div class="stat-s">${note}</div>`;
  if (st) {
    const si = stresIdx(num(st.skorStress)), kat = ST_STRES[si];
    const gabung = num(st.skorTidur) != null; // versi gabungan (Quick Tools) / data lama punya skor tidur sendiri
    const ti = gabung ? tidurIdx(num(st.skorTidur)) : null;
    const beda = st.kategoriStress && st.kategoriStress !== kat ? ` <small>(tersimpan: ${esc(st.kategoriStress)}, batas lama)</small>` : '';
    const kend = s => String(s || '').split(' | ').filter(x => x && x !== 'Aman');
    const list = (l, arr) => `<div style="margin-top:8px"><b style="font-size:11px">${l}</b>${arr.length ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ' <span class="none-text">tidak ada yang dominan</span>'}</div>`;
    const ksl = String(st.kesimpulan || ''), cut = ksl.indexOf(' - ');
    out.push(`<div class="full-tool"><h4>${gabung ? 'Stres & Tidur <small>(versi gabungan)</small>' : 'Stres (PSS-10)'} ${when('StressTidur')}</h4>
      <div class="full-head">${cut > 0 ? esc(ksl.slice(0, cut)) : esc(ksl)}</div>
      ${cut > 0 ? `<p>${esc(ksl.slice(cut + 3))}</p>` : ''}
      <table class="tbl">${row('Stres (PSS-10)', `${esc(st.skorStress)}/40 · <b>${kat}</b>${beda}`)}${gabung ? row('Kualitas tidur (skala Stress-Tidur)', `${esc(st.skorTidur)}/35 · <b>${ST_TIDUR[ti]}</b>`) : ''}${row('Acara', esc(st.event))}</table>
      ${gabung ? petaHtml(ti, si, ST_TIDUR, 'Baris: kualitas tidur (skala Stress-Tidur) · Kolom: tingkat stres') : ''}
      ${list('Kendala stres dominan', kend(st.kendalaStress))}${gabung ? list('Kendala tidur dominan', kend(st.kendalaTidur)) : ''}
      <div class="stat-s" style="margin-top:6px">Kategori stres: 0–13 / 14–26 / 27–40, pembagian yang lazim dipakai di penelitian (skala asli Cohen dkk. 1983 tidak menetapkan cutoff), mis. Rajpoot dkk. 2025, <a href="https://doi.org/10.7759/cureus.83358" target="_blank" rel="noopener">doi:10.7759/cureus.83358</a>.</div></div>`);
    if (p) {
      // Sumbu tidur dari PSQI: ≤5 → baris "Restoratif", 6–10 → "Bisa Lebih Optimal", >10 → "Perlu Perhatian"
      const total = num(p.skorTotal), pi = total <= 5 ? 2 : total <= 10 ? 1 : 0, q = ST_MATRIX[pi][si];
      out.push(`<div class="full-tool"><h4>Kombinasi Stres × Tidur (PSQI) <span class="stat-s" style="font-weight:400">· PSQI ${fmtDate(f.PSQI.submittedAt)}, Stres ${fmtDate(f.StressTidur.submittedAt)}</span></h4>
        <div class="full-head">${esc(q[0])}</div><p>${esc(q[1])}</p>
        ${petaHtml(pi, si, ['PSQI >10', 'PSQI 6–10', 'PSQI ≤5'], 'Baris: kualitas tidur dari PSQI · Kolom: tingkat stres (PSS-10)')}</div>`);
    }
  }
  return out.join('') + '<div class="stat-s" style="margin-top:10px">Ini hasil lengkap versi coach. Pengisi hanya melihat gambaran umum. Teks di sini salinan dari halaman tool; kalau teks di tool diubah, ubah juga konstanta <code>CHRONO</code>, <code>SJL_TXT</code>, <code>psqiTxt</code> di Console.</div>';
}

function bindProfileCard() {

      <li>Kalau klien menyebut pikiran menyakiti diri atau bunuh diri: hentikan agenda coaching, dengarkan, dan bantu klien segera terhubung ke layanan darurat / profesional.</li>
      <li style="list-style:none;margin-left:0;margin-top:6px"><b>Kontak rujukan:</b> ${esc(REFERRAL_CONTACTS)}</li></ul></div>`;
  const l = `<div class="q-l">${q.q}</div>${q.h ? `<div class="q-h">💡 ${esc(q.h)}</div>` : ''}${q.info ? `<div class="q-i">${q.info}</div>` : ''}`;
  let b = '';
  switch (q.t) {
    case 'text': b = `<input class="inp" data-k="${q.id}" maxlength="500" placeholder="${esc(q.ph || '')}">`; break;
    case 'dt': b = `<input class="inp" type="datetime-local" data-k="${q.id}">`; break;
    case 'area': b = `<textarea class="inp" data-k="${q.id}" maxlength="4000"></textarea>`; break;
    case 'num': b = `<div class="unit"><input class="inp" inputmode="decimal" data-k="${q.id}"><span>${q.u}</span></div>`; break;
    case 'radio': b = chips(q, 'radio'); break;
    case 'check': b = chips(q, 'checkbox'); break;
    case 'yesno': b = chips(Object.assign({}, q, { opts: ['Tidak', 'Ya'] }), 'radio'); break;
    case 'scale': { const o = []; for (let v = q.min; v <= q.max; v++) o.push(String(v));
      b = chips(Object.assign({}, q, { opts: o }), 'radio') + `<div class="stat-s" style="display:flex;justify-content:space-between;max-width:420px"><span>${q.lo}</span><span>${q.hi}</span></div>`; break; }
  }
  return `<div class="q ${q.note ? 'note' : ''}" id="sq_${q.id}">${l}${b}</div>`;
}

function applySesi() {
  document.querySelectorAll('#tabBody [data-k]').forEach(el => {
    const v = SA[el.dataset.k];
    if (el.type === 'radio') el.checked = v === el.value;
    else if (el.type === 'checkbox') el.checked = Array.isArray(v) && v.includes(el.value);
    else el.value = v == null ? '' : v;
  });
}
function onSesiInput(e) {
  const el = e.target, k = el.dataset && el.dataset.k; if (!k) return;
  if (e.type === 'input' && (el.type === 'radio' || el.type === 'checkbox')) return;
  if (el.type === 'radio') SA[k] = el.value;
  else if (el.type === 'checkbox') { const a = (SA[k] || []).filter(x => x !== el.value); if (el.checked) a.push(el.value); SA[k] = a; }
  else SA[k] = el.value;
  DIRTY = true; $('saveMsg').textContent = 'Ada perubahan belum disimpan';
  updSesiOut();
}

function sesiCalc() {
  const r = {};
  r.scoff = [1, 2, 3, 4, 5].filter(i => SA['scoff' + i] === 'Ya').length;
  r.scoffDone = [1, 2, 3, 4, 5].every(i => SA['scoff' + i]);
  r.phq = [1, 2].reduce((a, i) => a + (SA['phq' + i] ? parseInt(SA['phq' + i], 10) : 0), 0);
  r.phqDone = [1, 2].every(i => SA['phq' + i]);
  return r;
}
function updSesiOut() {
  const r = sesiCalc();
  if ($('out_scoffScore')) $('out_scoffScore').innerHTML = `<span class="score ${r.scoff >= 2 ? 's-risk' : 's-ok'}">Skor SCOFF: ${r.scoff}/5 ${r.scoffDone ? (r.scoff >= 2 ? '· POSITIF (≥2), pertimbangkan rujukan' : '· negatif') : '· belum lengkap'}</span>`;
  if ($('out_phqScore')) $('out_phqScore').innerHTML = `<span class="score ${r.phq >= 3 ? 's-risk' : 's-ok'}">Skor PHQ-2: ${r.phq}/6 ${r.phqDone ? (r.phq >= 3 ? '· POSITIF (≥3), sarankan evaluasi lanjut' : '· negatif') : '· belum lengkap'}</span>`;
}

function sesiAnswer(q) {
  let v = SA[q.id];
  if (Array.isArray(v)) v = v.join(', ');
  if (v == null || String(v).trim() === '') return '';
  if (q.t === 'num') return `${v} ${q.u}`;
  return String(v).trim();
}

async function saveSesi() {
  const c = ctx();
  const r = sesiCalc();
  const data = { nama: clientName() }, raw = [];
  SESI.filter(s => !s.show || s.show(c)).forEach(s => s.qs.forEach(q => {

    data[q.id] = v;
    if (v) raw.push({ s: s.title, q: strip(q.q), v });
  }));
  const flags = [];
  if (r.scoffDone && r.scoff >= 2) flags.push(`SCOFF positif (${r.scoff}/5): pertimbangkan rujukan gangguan makan`);
  if (r.phqDone && r.phq >= 3) flags.push(`PHQ-2 positif (${r.phq}/6): sarankan evaluasi kesehatan jiwa`);
  Object.assign(data, {
    scoffSkor: r.scoffDone ? r.scoff : '', phq2Skor: r.phqDone ? r.phq : '', flags: flags.join(' | ')
  });
  if (data.scoffSkor !== '') raw.push({ s: 'Skrining Rujukan', q: 'Skor SCOFF', v: `${r.scoff}/5` });
  if (data.phq2Skor !== '') raw.push({ s: 'Skrining Rujukan', q: 'Skor PHQ-2', v: `${r.phq}/6` });
  $('btnSave').disabled = true; $('saveMsg').textContent = 'Menyimpan…';

    $('saveMsg').textContent = 'Gagal menyimpan: ' + (e.message || e);
  } finally { if ($('btnSave')) $('btnSave').disabled = false; }
}

// ── Parse & cocokkan jawaban AI ─────────────────────────────────────────
function aiParseJson(text) {
  let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('Tidak menemukan objek JSON { … } di teks yang ditempel.');
  try { return JSON.parse(s.slice(a, b + 1)); }
  catch (e) { throw new Error('JSON tidak valid: ' + e.message); }
}
// Samakan huruf besar-kecil, jenis tanda strip (- – —) dan spasi sebelum membandingkan
const aiCanon = x => String(x == null ? '' : x).toLowerCase().replace(/[‐-―−]/g, '-').replace(/\s+/g, ' ').replace(/\s*-\s*/g, '-').trim();
function aiMatchOpt(opts, v) {
  const s = aiCanon(v);
  if (!s) return null;
  const ex = opts.find(o => aiCanon(o) === s); if (ex) return ex;
  if (/^\d+$/.test(s)) { const n = opts.filter(o => aiCanon(o).startsWith(s + ' ')); if (n.length === 1) return n[0]; }
  if (['ya', 'yes', 'true'].includes(s) && opts.includes('Ya')) return 'Ya';
  if (['tidak', 'no', 'false', 'tdk'].includes(s) && opts.includes('Tidak')) return 'Tidak';
  if (s.length >= 3) { const p = opts.filter(o => aiCanon(o).startsWith(s)); if (p.length === 1) return p[0]; }
  return null;
}
// → { val } (sah), { val, extra } (sebagian sah), { bad } (tidak cocok), atau null (kosong)
function aiNormalize(f, v) {
  if (v == null || (typeof v === 'string' && !v.trim()) || (Array.isArray(v) && !v.length)) return null;
  if (f.t === 'radio' || f.t === 'yesno') { const m = aiMatchOpt(f.opts, Array.isArray(v) ? v[0] : v); return m ? { val: m } : { bad: String(v) }; }
  if (f.t === 'check') {
    const arr = (Array.isArray(v) ? v : String(v).split(/[,;\n]/)).map(x => String(x).trim()).filter(Boolean);
    const ok = [], extra = [];
    arr.forEach(x => { const m = aiMatchOpt(f.opts, x); if (m) { if (!ok.includes(m)) ok.push(m); } else extra.push(x); });
    return ok.length ? { val: ok, extra: extra.join(', ') } : { bad: arr.join(', ') };
  }
  if (f.t === 'scale') { const n = Math.round(num(v)); return isFinite(n) ? { val: String(Math.min(Math.max(n, f.min), f.max)) } : { bad: String(v) }; }
  const t = Array.isArray(v) ? v.map(x => String(x).trim()).join('\n') : typeof v === 'object' ? JSON.stringify(v) : String(v).trim();
  return t ? { val: t } : null;
}
const aiEmpty = v => v == null || (Array.isArray(v) ? !v.length : !String(v).trim());
const aiSame = (a, b) => Array.isArray(a) || Array.isArray(b) ? [].concat(a || []).slice().sort().join('|') === [].concat(b || []).slice().sort().join('|') : String(a).trim() === String(b).trim();
const aiShow = v => Array.isArray(v) ? v.join(', ') : String(v);

  let pasted = '';
  const stage1 = err => {
    step.innerHTML = `<p class="stat-s" style="margin-bottom:8px">${help}</p>
      <textarea id="aiIn" placeholder="Tempel jawaban AI (JSON) di sini…"></textarea>

    step.querySelector('#aiIn').value = pasted;
  };
  const stage2 = obj => {
    const fill = [], conflict = [], bad = [], unknown = [];
    Object.keys(obj).forEach(id => {
      const f = byId[id];
      if (!f) { if (!aiEmpty(obj[id])) unknown.push({ id, raw: aiShow(obj[id]) }); return; }
      const n = aiNormalize(f, obj[id]); if (!n) return;
      if (n.bad != null) { bad.push({ f, raw: n.bad }); return; }
      if (n.extra) bad.push({ f, raw: n.extra });
      const cur = getCur(id);
      if (aiEmpty(cur)) fill.push({ f, val: n.val });
      else if (!aiSame(cur, n.val)) conflict.push({ f, val: n.val, cur });
    });
    const row = (f, v) => `<div class="ai-row"><b>${esc(f.label)}</b><span class="stat-s"> · ${esc(f.sec)}</span><div>${esc(aiShow(v)).slice(0, 400)}</div></div>`;
    step.innerHTML = `
      <div class="ai-sum"><span class="tg-ok">✅ ${fill.length} akan diisi</span> · <span class="tg-mid">⚠️ ${conflict.length} bentrok</span> · <span class="tg-bad">❌ ${bad.length + unknown.length} tidak cocok</span></div>
      <div class="ai-list">
      ${fill.length ? `<div class="q-l">✅ Kolom kosong yang akan diisi</div>${fill.map(x => row(x.f, x.val)).join('')}` : ''}
      ${conflict.length ? `<div class="q-l" style="margin-top:10px">⚠️ Sudah ada isinya & berbeda: pilih per kolom</div>${conflict.map((x, i) => `<div class="ai-row"><b>${esc(x.f.label)}</b><span class="stat-s"> · ${esc(x.f.sec)}</span>
          <label class="ai-opt"><input type="radio" name="cf${i}" value="keep" checked> Pertahankan: ${esc(aiShow(x.cur)).slice(0, 300)}</label>
          <label class="ai-opt"><input type="radio" name="cf${i}" value="ai"> Pakai AI: ${esc(aiShow(x.val)).slice(0, 300)}</label></div>`).join('')}` : ''}
      ${bad.length ? `<div class="q-l" style="margin-top:10px">❌ Tidak cocok dengan pilihan${fields.some(f => f.noteId) ? ' (ditambahkan ke catatan bagiannya)' : ''}</div>${bad.map(x => row(x.f, x.raw)).join('')}` : ''}
      ${unknown.length ? `<div class="q-l" style="margin-top:10px">❌ Field tidak dikenal (diabaikan)</div>${unknown.map(x => `<div class="ai-row"><b>${esc(x.id)}</b><div>${esc(x.raw).slice(0, 300)}</div></div>`).join('')}` : ''}
      ${!fill.length && !conflict.length && !bad.length && !unknown.length ? '<div class="none-text">Tidak ada isian baru (semua kosong atau sama dengan yang sudah ada).</div>' : ''}
      </div>
      <div style="text-align:right;margin-top:10px"><button class="btn btn-o" data-a="back">Kembali</button> <button class="btn btn-p" data-a="apply">Terapkan</button></div>`;
    step._res = { fill, conflict, bad };
  };
  stage1();
  m.addEventListener('click', e => {
    const a = e.target.dataset && e.target.dataset.a; if (!a) return;
    if (a === 'close') m.remove();
    else if (a === 'back') stage1();
    else if (a === 'parse') {
      pasted = step.querySelector('#aiIn').value;
      try { stage2(aiParseJson(pasted)); } catch (err) { stage1(err.message); }
    } else if (a === 'apply') {
      const { fill, conflict, bad } = step._res, vals = {}, notes = {};
      fill.forEach(x => { vals[x.f.id] = x.val; });
      conflict.forEach((x, i) => { const r = step.querySelector(`input[name="cf${i}"]:checked`); if (r && r.value === 'ai') vals[x.f.id] = x.val; });
      bad.forEach(x => { if (x.f.noteId) (notes[x.f.noteId] = notes[x.f.noteId] || []).push(`[AI] ${x.f.label}: ${x.raw}`); });
      onApply(vals, notes);
      m.remove();
    }
  });
}

function mdLite(t) {
  const out = [];
  let inList = false;
  String(t || '').split('\n').forEach(line => {
    const l = esc(line.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
    if (/^[-*•]\s+/.test(line.trim())) { if (!inList) { out.push('<ul>'); inList = true; } out.push('<li>' + l.replace(/^[-*•]\s+/, '') + '</li>'); return; }
    if (inList) { out.push('</ul>'); inList = false; }
    if (/^#{1,4}\s+/.test(line.trim())) out.push('<h4>' + l.replace(/^#{1,4}\s+/, '') + '</h4>');
    else if (l) out.push('<p>' + l + '</p>');
  });
  if (inList) out.push('</ul>');
  return out.join('');
}

// [key, label, unit, arah baik (1 naik, -1 turun, 0 netral), tipe]
const MEAS = [
  ['bb', 'Berat badan', 'kg', 0], ['tb', 'Tinggi badan', 'cm', 0],
  ['perut', 'Lingkar perut (sejajar pusar)', 'cm', 0], ['pinggang', 'Lingkar pinggang', 'cm', 0], ['panggul', 'Lingkar panggul', 'cm', 0],
  ['dada', 'Lingkar dada bawah', 'cm', 0], ['leher', 'Lingkar leher', 'cm', 0],
  ['lenganKa', 'Lengan atas kanan', 'cm', 0], ['lenganKi', 'Lengan atas kiri', 'cm', 0], ['pahaKa', 'Paha kanan', 'cm', 0], ['pahaKi', 'Paha kiri', 'cm', 0],
  ['bfBia', 'Body fat BIA (alat)', '%', -1], ['otot', 'Massa otot (BIA)', 'kg', 1], ['visceral', 'Visceral fat (alat)', 'level', -1], ['bmrAlat', 'BMR (alat)', 'kkal', 0],
  ['tensi', 'Tensi', 'mmHg', null, 'text'], ['rhr', 'Detak jantung istirahat', 'bpm', -1], ['gripKa', 'Grip kanan', 'kg', 1], ['gripKi', 'Grip kiri', 'kg', 1]
];
const MEAS_CALC = [
  ['bmi', 'BMI', '', -1, 1], ['whr', 'Rasio pinggang–panggul', '', -1, 2], ['whtr', 'Rasio pinggang–tinggi', '', -1, 2],
  ['bfNavy', 'Body fat Navy (rumus)', '%', -1, 1], ['bfRfm', 'Body fat RFM (rumus)', '%', -1, 1],
  ['bmrHitung', 'BMR hitung', 'kkal', 0, 0], ['bbMaxAsia', 'BB maks. (BMI Asia 22,9)', 'kg', 0, 1], ['bbMaxFat', `BB maks. (target BF ${BF_TARGET.L}%/${BF_TARGET.P}%)`, 'kg', 0, 1], ['bbObesFat', `BB batas obesitas (BF ${BF_OBESITAS.L}%/${BF_OBESITAS.P}%)`, 'kg', 0, 1]
];
const log10 = Math.log10;

function calcMeasure(m) {
  const d = intakeData(), L = d.jk === 'Laki-laki', P = d.jk === 'Perempuan', usia = num(d.usia);
  const bb = num(m.bb), tb = num(m.tb), pr = num(m.perut), pg = num(m.pinggang), pp = num(m.panggul), lh = num(m.leher), bf = num(m.bfBia);
  const r = {};
  if (bb && tb) { r.bmi = bb / Math.pow(tb / 100, 2); r.bbMaxAsia = 22.9 * Math.pow(tb / 100, 2); }
  if (pg && pp) r.whr = pg / pp;
  if (pg && tb) r.whtr = pg / tb;
  // US Navy: pria pakai lingkar perut (sejajar pusar); wanita pinggang + panggul
  if (L && pr && lh && tb && pr > lh) r.bfNavy = 495 / (1.0324 - 0.19077 * log10(pr - lh) + 0.15456 * log10(tb)) - 450;
  if (P && pg && pp && lh && tb) r.bfNavy = 495 / (1.29579 - 0.35004 * log10(pg + pp - lh) + 0.22100 * log10(tb)) - 450;
  // RFM (Woolcott & Bergman 2018): 64/76 − 20 × tinggi/lingkar pinggang
  const w = pg || pr;
  if (tb && w && (L || P)) r.bfRfm = (L ? 64 : 76) - 20 * tb / w;
  if (bb && bf) { r.bmrHitung = 370 + 21.6 * bb * (1 - bf / 100); r.bmrMetode = 'Katch-McArdle'; 
    const ffm = bb * (1 - bf / 100); // massa bebas lemak
    r.bbMaxFat = ffm / (1 - (L ? BF_TARGET.L : BF_TARGET.P) / 100);
    r.bbObesFat = ffm / (1 - (L ? BF_OBESITAS.L : BF_OBESITAS.P) / 100); }
  else if (bb && tb && usia && (L || P)) { r.bmrHitung = 10 * bb + 6.25 * tb - 5 * usia + (L ? 5 : -161); r.bmrMetode = 'Mifflin-St Jeor'; }
  return r;
}
function measVal(rec, k) {
  const v = rec.data ? rec.data[k] : rec[k];
  return v === '' || v == null ? null : v;
}

};
function gripPercentile(jk, usia, v) {
  const key = jk === 'Laki-laki' ? 'L' : jk === 'Perempuan' ? 'P' : null;
  if (!key || usia == null || v == null) return null;
  const gi = Math.min(Math.max(Math.floor((usia - 20) / 5), 0), 16);
  const p = GRIP_REF[key][gi], lo = 20 + gi * 5;
  let band;
  if (v < p[0]) band = '< P5';
  else if (v >= p[10]) band = '> P95';
  else { const i = p.findIndex((x, j) => v >= x && v < p[j + 1]); band = `P${GRIP_P[i]}–P${GRIP_P[i + 1]}`; }
  const tone = v < p[2] ? 'bad' : v > p[8] ? 'ok' : 'mid';
  return { band, p50: p[5], p20: p[2], tone, label: tone === 'bad' ? 'di bawah rata-rata seusianya (perlu dilatih)' : tone === 'ok' ? 'di atas rata-rata seusianya' : 'rata-rata seusianya',
    grup: gi === 16 ? '100+' : `${lo}–${lo + 4}`, muda: usia < 20 };
}

// Ukuran terbaru (pengukuran coach), dilengkapi data mandiri intake bila belum diukur
function latestBody() {
  const list = CD.measurements || [], last = list[list.length - 1], d = intakeData(), m = {};
  MEAS.forEach(([k]) => { const v = last ? measVal(last, k) : null; if (v != null) m[k] = v; });
  ['bb', 'tb', 'pinggang', 'perut', 'panggul'].forEach(k => { if (m[k] == null && num(d[k]) != null) m[k] = num(d[k]); });
  if (m.bfBia == null && num(d.bf) != null) m.bfBia = num(d.bf);
  return { m, tgl: last ? measVal(last, 'tanggalUkur') : '', sumber: last ? 'pengukuran coach' : 'data mandiri intake' };
}

function bodyTargets() {
  const d = intakeData(), L = d.jk === 'Laki-laki', P = d.jk === 'Perempuan', usia = num(d.usia);
  const { m, tgl, sumber } = latestBody(), r = calcMeasure(m);
  const bb = num(m.bb), tb = num(m.tb), pg = num(m.pinggang), pr = num(m.perut), bf = num(m.bfBia);
  const t = { tgl, sumber, rows: [], vital: [], bb, w: {} };
  const tm = tb ? tb / 100 : null;
  if (tm) { t.w.ideal = 22.9 * tm * tm; t.w.idealLo = 18.5 * tm * tm; }
  if (r.bbMaxFat) t.w.bf = r.bbMaxFat;
  const diff = (v, target, unit, dd) => v == null || target == null ? '' : v > target ? `${fmt(v - target, dd)} ${unit} di atas` : 'sudah di bawah batas';
  if (tm) t.rows.push({ k: 'BB ideal (BMI Asia 18,5–22,9)', now: bb != null ? `${fmt(bb, 1)} kg` : '–', target: `${fmt(t.w.idealLo, 1)}–${fmt(t.w.ideal, 1)} kg`,
    gap: bb == null ? '' : bb > t.w.ideal ? `turun ${fmt(bb - t.w.ideal, 1)} kg ke batas atas` : bb < t.w.idealLo ? `naik ${fmt(t.w.idealLo - bb, 1)} kg` : 'dalam rentang', tone: bb == null ? '' : bb > t.w.ideal || bb < t.w.idealLo ? 'bad' : 'ok' });
  if (r.bbMaxFat) t.rows.push({ k: `BB dengan BF target coach (${L ? BF_TARGET.L : BF_TARGET.P}%)`, now: `${fmt(bb, 1)} kg`, target: `≤ ${fmt(r.bbMaxFat, 1)} kg`,
    gap: bb > r.bbMaxFat ? `turun ${fmt(bb - r.bbMaxFat, 1)} kg (lemak)` : 'tercapai', tone: bb > r.bbMaxFat ? 'bad' : 'ok', note: `batas obesitas BF: ${fmt(r.bbObesFat, 1)} kg` });
  const w = pg != null ? pg : pr, wLbl = pg != null ? 'pinggang' : 'perut';
  if (L || P) {
    const asia = L ? 90 : 80, whtr = tb ? 0.5 * tb : null, ketat = whtr != null ? Math.min(asia, whtr) : asia;
    t.rows.push({ k: `Lingkar ${wLbl} maks.`, now: w != null ? `${fmt(w, 1)} cm` : '–', target: `< ${asia} cm (Asia)${whtr != null ? ` · ≤ ${fmt(whtr, 1)} cm (½ tinggi)` : ''}`,
      gap: w == null ? '' : w >= ketat ? `turun ${fmt(w - ketat, 1)} cm` : 'di bawah batas', tone: w == null ? '' : w >= ketat ? 'bad' : 'ok' });
    if (r.whr != null) t.rows.push({ k: 'Rasio pinggang–panggul', now: fmt(r.whr, 2), target: `< ${L ? '0,90' : '0,85'}`, gap: diff(r.whr, L ? 0.9 : 0.85, '', 2), tone: r.whr >= (L ? 0.9 : 0.85) ? 'bad' : 'ok' });

      t.rows.push({ k: 'Body fat (BIA)', now: `${fmt(bf, 1)}%`, target: `≤ ${tg}% (target coach) · obesitas ≥ ${ob}%`, gap: bf > tg ? `turun ${fmt(bf - tg, 1)} poin` : 'tercapai', tone: bf >= ob ? 'bad' : bf > tg ? 'mid' : 'ok' }); }
  }
  if (r.whtr != null) t.rows.push({ k: 'Rasio pinggang–tinggi', now: fmt(r.whtr, 2), target: '< 0,50', gap: diff(r.whtr, 0.5, '', 2), tone: r.whtr >= 0.5 ? 'bad' : 'ok' });
  const vis = num(m.visceral);
  if (vis != null) t.rows.push({ k: 'Visceral fat (alat)', now: fmt(vis, 0), target: '1–9 normal · 10–14 tinggi · ≥ 15 sangat tinggi', gap: vis >= 15 ? 'sangat tinggi' : vis >= 10 ? 'tinggi' : 'normal', tone: vis >= 15 ? 'bad' : vis >= 10 ? 'mid' : 'ok', note: 'skala Omron/Tanita; tergantung merek alat' });
  // Vital

  if (tn) { const s = +tn[1], di = +tn[2], st = s >= 140 || di >= 90 ? ['hipertensi (ulang ukur & sarankan cek dokter)', 'bad'] : s >= 120 || di >= 80 ? ['normal-tinggi', 'mid'] : ['optimal', 'ok'];
    t.vital.push({ k: 'Tensi', now: `${s}/${di} mmHg`, target: '< 120/80 optimal · 120–139/80–89 normal-tinggi · ≥ 140/90 hipertensi', gap: st[0], tone: st[1] }); }
  const rhr = num(m.rhr);
  if (rhr != null) t.vital.push({ k: 'Detak jantung istirahat', now: `${rhr} bpm`, target: '60–100 bpm normal; lebih rendah umumnya lebih bugar', gap: rhr > 100 ? 'tinggi' : rhr < 60 ? 'rendah (wajar bila terlatih)' : 'normal', tone: rhr > 100 ? 'bad' : 'ok' });
  const gk = num(m.gripKa), gki = num(m.gripKi), g = [gk, gki].filter(x => x != null);
  if (g.length) {
    const best = Math.max(...g), gp = gripPercentile(d.jk, usia, best);
    t.vital.push(gp ? { k: `Hand grip (terbaik ${gk != null && best === gk ? 'kanan' : 'kiri'})`, now: `${fmt(best, 1)} kg`,
      target: `median usia ${gp.grup}: ${fmt(gp.p50, 1)} kg · batas bawah (P20): ${fmt(gp.p20, 1)} kg${usia >= 60 ? ` · sarkopenia AWGS: < ${L ? 28 : 18} kg` : ''}`,
      gap: `${gp.band} · ${gp.label}${gp.muda ? ' (usia < 20, dibandingkan dengan kelompok 20–24)' : ''}`, tone: gp.tone }
      : { k: 'Hand grip', now: `${fmt(best, 1)} kg`, target: 'Butuh usia & jenis kelamin', gap: 'lengkapi di Data Klien', tone: '' });
  }
  return t;
}

// Kalkulator protein & air minum: parameter bebas, tidak disimpan
let CALC = { pBasis: 'now', pLo: 1.2, pHi: 1.6, meals: 3, pManual: '', aBasis: 'now', mlkg: 30, menit: 0, panas: false };
const PROT_PRESET = [['Sedenter', 0.8, 1.0], ['Aktif', 1.2, 1.6], ['Latihan beban / defisit', 1.6, 2.2]];
function calcBasisW(t, basis, manual) {
  return basis === 'ideal' ? t.w.ideal : basis === 'bf' ? t.w.bf : basis === 'manual' ? num(manual) : t.bb;
}
function calcResult(t) {
  const W = calcBasisW(t, CALC.pBasis, CALC.pManual), A = calcBasisW(t, CALC.aBasis, CALC.pManual), meals = Math.max(1, num(CALC.meals) || 3);
  const out = {};
  if (W) { out.pLo = W * num(CALC.pLo); out.pHi = W * num(CALC.pHi); out.pMealLo = out.pLo / meals; out.pMealHi = out.pHi / meals; out.W = W; }
  if (A) { out.air = A * (num(CALC.mlkg) || 30) / 1000 + (num(CALC.menit) || 0) / 60 * 0.5 + (CALC.panas ? 0.5 : 0); out.A = A; }
  return out;
}
function basisOpts(t, sel) {
  return [['now', `BB sekarang${t.bb ? ` (${fmt(t.bb, 1)} kg)` : ''}`], ['ideal', `Batas atas BB ideal${t.w.ideal ? ` (${fmt(t.w.ideal, 1)} kg)` : ''}`], ['bf', `BB target BF${t.w.bf ? ` (${fmt(t.w.bf, 1)} kg)` : ' (butuh BF)'}`], ['manual', 'Isi manual']]

}
function calcHtml(t) {

      <input class="inp" data-calc="pManual" inputmode="decimal" placeholder="kg (untuk isi manual)" style="margin-top:6px;${CALC.pBasis === 'manual' || CALC.aBasis === 'manual' ? '' : 'display:none'}">
      <div class="stat-l" style="margin-top:8px">g/kg per hari</div>
      <div class="rk-chips">${PROT_PRESET.map(([l, a, b]) => `<button type="button" class="rk-chip" data-preset="${a}|${b}">${esc(l)} ${fmt(a, 1)}–${fmt(b, 1)}</button>`).join('')}</div>
      <div style="display:flex;gap:6px;align-items:center"><input class="inp" data-calc="pLo" inputmode="decimal" style="max-width:80px"> – <input class="inp" data-calc="pHi" inputmode="decimal" style="max-width:80px"><span class="stat-s">g/kg · makan</span><input class="inp" data-calc="meals" inputmode="numeric" style="max-width:60px"><span class="stat-s">x/hari</span></div>

/* Grafik garis kecil (SVG). Palet divalidasi (CVD-safe) di atas latar putih. */
const SERIES_COLORS = ['#009E94', '#C2410C', '#6D28D9'];
function lineChart(title, unit, series, list) {
  const W = 320, H = 150, pl = 34, pr = 58, pt = 10, pb = 22;
  const xs = list.map(r => measVal(r, 'tanggalUkur'));
  const all = series.flatMap(s => s.vals.filter(v => v != null));
  if (!all.length) return '';
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.15 || Math.max(1, Math.abs(hi) * 0.05);
  lo -= pad; hi += pad;
  const X = i => pl + (xs.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (xs.length - 1));
  const Y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const ticks = [lo + pad, (lo + hi) / 2, hi - pad];
  const grid = ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="#ece8e1" stroke-width="1"/><text x="${pl - 4}" y="${Y(t) + 3}" text-anchor="end" font-size="8.5" fill="#6b7d7c">${fmt(t, 1)}</text>`).join('');
  const xl = [0, xs.length - 1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 && xs.length > 1 ? 'start' : 'end'}" font-size="8.5" fill="#6b7d7c">${fmtDate(xs[i])}</text>`).join('');
  const labels = [];
  const lines = series.map(s => {
    const pts = s.vals.map((v, i) => v == null ? null : [X(i), Y(v), v, i]).filter(Boolean);
    if (!pts.length) return '';
    const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('');
    const lastP = pts[pts.length - 1];
    labels.push({ x: lastP[0] + 7, y: lastP[1] + 3, text: `${s.short || s.name} ${fmt(lastP[2], 1)}` });
    return `<path d="${path}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p => `<g><circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${s.color}" stroke="#fff" stroke-width="2"/><circle cx="${p[0]}" cy="${p[1]}" r="10" fill="transparent"><title>${esc(s.name)} · ${fmtDate(xs[p[3]])}: ${fmt(p[2], 1)} ${unit}</title></circle></g>`).join('')}`;
  }).join('');
  // Label ujung garis: geser supaya tidak saling tumpuk (jarak minimal 11px)
  labels.sort((a, b) => a.y - b.y).forEach((l, i, arr) => { if (i && l.y - arr[i - 1].y < 11) l.y = arr[i - 1].y + 11; });
  const labelSvg = labels.map(l => `<text x="${l.x}" y="${l.y}" font-size="9" fill="#0e181d">${esc(l.text)}</text>`).join('');
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>` : '';
  return `<div class="chart"><div class="chart-t">${esc(title)} <small style="color:var(--muted);font-weight:500">(${unit})</small></div>${legend}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}${xl}${lines}${labelSvg}</svg></div>`;
}
function chartsHtml(list) {
  const S = (keys) => keys.map(([k, name, short], i) => ({ name, short, color: SERIES_COLORS[i], vals: list.map(r => num(measVal(r, k))) })).filter(s => s.vals.some(v => v != null));
  const c = [
    lineChart('Berat badan', 'kg', S([['bb', 'Berat badan', 'BB']]), list),
    lineChart('Lingkar tubuh', 'cm', S([['perut', 'Perut', 'Perut'], ['pinggang', 'Pinggang', 'Pgg'], ['panggul', 'Panggul', 'Pgl']]), list),
    lineChart('Body fat', '%', S([['bfBia', 'BIA (alat)', 'BIA'], ['bfNavy', 'Navy', 'Navy'], ['bfRfm', 'RFM', 'RFM']]), list)
  ].filter(Boolean).join('');
  return `<div class="charts">${c}</div>${list.length < 2 ? '<p class="stat-s" style="margin-top:6px">Tren mulai terlihat setelah 2 pengukuran atau lebih.</p>' : ''}`;
}

// Kalimat referensi dari hasil tool (bisa disisipkan ke kotak Tidur / Stres)
function rkRefs(kind) {
  const H = CD.history || {}, out = [];
  const last = f => (H[f] || []).slice(-1)[0];
  if (kind === 'tidur') {
    const m = last('MCTQ'), p = last('PSQI'), st = last('StressTidur');
    if (m) out.push(`Chronotype ${m.data.chronotype}, social jet lag ${m.data.sjl}, sleep debt ${m.data.sleepDebt}.`);
    if (p) out.push(`Skor PSQI ${p.data.skorTotal}/21 (${p.data.kategori}).`);
    if (st && st.data.kategoriTidur) out.push(`Kualitas tidur (Stress-Tidur): ${st.data.kategoriTidur}.`);
  } else {
    const st = last('StressTidur');
    if (st) out.push(`Tingkat stres (PSS-10) ${st.data.skorStress}/40 (${stresKategori(st.data)}).`);
    const s = (CD.sessions || [])[0];
    if (s && s.data.tenang) out.push(`Teknik menenangkan diri: ${s.data.tenang}.`);
  }
  return out;
}

// arah: 1 = naik itu baik, -1 = turun itu baik, 0 = angka tanpa penilaian (tergantung goal),
// undefined = jawaban kategori → tidak dihitung selisihnya
function deltaCell(a, b, dir) {
  if (dir === undefined) return '<td></td>';
  const x = num(a), y = num(b);
  if (x == null || y == null) return '<td></td>';
  const d = y - x;
  if (!d) return '<td>=</td>';
  const good = dir ? (d * dir > 0) : null; // dir 0 → netral
  return `<td class="${good == null ? '' : good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmt(Math.abs(d), Math.abs(d) < 1 ? 2 : 1)}</td>`;
}

      <table class="tbl ba">${scores}<tr><td>MCTQ · chronotype & social jet lag</td><td colspan="2">${mctq || '<span class="none-text">belum diisi</span>'}</td></tr></table></div>
    <div class="card"><div class="card-title">Antropometri Coach (pertama vs terakhir)</div>${sessTbl}</div>
    ${refl ? `<div class="card"><div class="card-title">Refleksi Klien</div>${refl}</div>` : ''}`;
}

/* ════════════════════════════════════════════════════════════════════════
   REPORT
   ════════════════════════════════════════════════════════════════════════ */
function reportBody(d) {
  const ml = CD.measurements || [];
  const f = ml[0] && ml[0].data, l = ml.length > 1 ? ml[ml.length - 1].data : null;
  const v = (o, k, dd) => o && o[k] !== '' && o[k] != null ? (num(o[k]) != null && k !== 'tensi' ? fmt(num(o[k]), dd == null ? 1 : dd) : esc(o[k])) : '–';
  const rows = [['bb', 'Berat badan (kg)'], ['tb', 'Tinggi badan (cm)'], ['perut', 'Lingkar perut (cm)'], ['pinggang', 'Lingkar pinggang (cm)'], ['panggul', 'Lingkar panggul (cm)'],
    ['bfBia', 'Body fat BIA (%)', 'bf'], ['bfNavy', 'Body fat Navy (%)'], ['bfRfm', 'Body fat RFM (%)'], ['otot', 'Massa otot BIA (kg)'], ['visceral', 'Visceral fat'],
    ['bmi', 'BMI'], ['whr', 'Rasio pinggang–panggul', null, 2], ['whtr', 'Rasio pinggang–tinggi', null, 2], ['tensi', 'Tensi'], ['gripKa', 'Grip kanan (kg)'], ['gripKi', 'Grip kiri (kg)']];
  return `<table class="tbl"><tr><th></th><th>Mandiri (intake)</th><th>Coach ${f ? fmtDate(f.tanggalUkur) : ''}</th>${l ? `<th>Coach ${fmtDate(l.tanggalUkur)}</th>` : ''}</tr>
    ${rows.map(([k, lbl, ik, dd]) => `<tr><td>${lbl}</td><td>${v(d, ik || k, dd)}</td><td>${v(f, k, dd)}</td>${l ? `<td>${v(l, k, dd)}</td>` : ''}</tr>`).join('')}</table>
    ${ml.length > 1 ? `<div style="margin-top:10px">${chartsHtml(ml)}</div>` : ''}`;
}

function renderReport() {
  const d = intakeData(), s = lastSession(), sd = (s && s.data) || {};
  const row = (l, v) => v == null || v === '' ? '' : `<tr><td>${esc(l)}</td><td>${esc(v)}</td></tr>`;
  const bodyRow = (l, a, b) => `<tr><td>${esc(l)}</td><td>${esc(a || '–')}</td><td>${esc(b || '–')}</td></tr>`;
  const m = CD.forms.MCTQ && CD.forms.MCTQ.data, p = CD.forms.PSQI && CD.forms.PSQI.data, st = CD.forms.StressTidur && CD.forms.StressTidur.data;
  $('tabBody').innerHTML = `
    <div class="no-print" style="margin-bottom:12px"><button class="btn btn-p" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div>
    <div class="rep">
      <div class="rep-h"><small>Laporan Assessment Awal · Synthesis Coaching Lab</small><b>${esc(clientName())}</b>
        <div>${[d.usia ? d.usia + ' tahun' : '', d.jk, d.pekerjaan, '+' + CUR].filter(Boolean).map(esc).join(' · ')} · Dicetak ${fmtDate(new Date().toISOString())}</div></div>
      <div class="rep-s"><div class="card-title">Tujuan</div><table class="tbl">
        ${row('Goal klien', d.goal)}${row('Hambatan (klien)', d.hambatan)}${row('Kesiapan berubah', sd.miSkor || d.kesiapan ? (sd.miSkor || d.kesiapan) + '/10' : '')}
        ${row('Target 3 bulan', sd.miTarget)}${row('Langkah kecil pertama', sd.miLangkah)}</table></div>
      <div class="rep-s"><div class="card-title">Flag & Keamanan</div>${flagsHtml()}</div>
      ${CD.ai.length ? `<div class="rep-s"><div class="card-title">Analisis AI (${fmtDate(CD.ai[0].submittedAt)}) · ditinjau coach</div><div class="ai-text">${mdLite(CD.ai[0].data.analisis)}</div></div>` : ''}
      <div class="rep-s"><div class="card-title">Tubuh</div>${reportBody(d)}</div>
      <div class="rep-s"><div class="card-title">Tidur & Stres</div>${scoresHtml()}</div>
      ${s ? `<div class="rep-s"><div class="card-title">Rencana Coach</div><table class="tbl">
        ${row('Prioritas intervensi', sd.prioritas)}${row('Rencana 2 minggu', sd.rencana)}${row('Tindak lanjut / rujukan', sd.tindakLanjut)}
        ${row('Skor SCOFF', sd.scoffSkor !== '' && sd.scoffSkor != null ? sd.scoffSkor + '/5' : '')}${row('Skor PHQ-2', sd.phq2Skor !== '' && sd.phq2Skor != null ? sd.phq2Skor + '/6' : '')}
        ${row('Catatan umum', sd.catatanUmum)}</table></div>` : ''}
      <div class="rep-s"><div class="card-title">Lampiran A · Jawaban Intake</div>${rawHtml(CD.forms.Intake && CD.forms.Intake.raw, false, ['Flag untuk Coach', 'Sebelum Mulai'])}</div>
      ${s ? `<div class="rep-s"><div class="card-title">Lampiran B · Catatan Sesi ${fmtDate(s.submittedAt)}</div>${rawHtml(s.raw, false)}</div>` : ''}
    </div>`;
  // Saat cetak, buka semua lampiran
  window.onbeforeprint = () => document.querySelectorAll('.rep details').forEach(x => x.open = true);
}

window.addEventListener('beforeunload', e => { if (DIRTY || RK_DIRTY) { e.preventDefault(); e.returnValue = ''; } });
loadClients();
